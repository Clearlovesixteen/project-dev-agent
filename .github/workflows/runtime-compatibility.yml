name: Node 运行兼容性

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["18.19.0", "18.19.1", "20.19.6"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 源码依赖在维护环境构建；安装者使用的是已经打包的运行文件。
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.6"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:plugin
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 用目标 Node 运行完整测试及独立插件 MCP 流程
        shell: bash
        run: |
          # 保留完整 TAP 和原始退出码，供失败后的检查摘要使用。
          set -o pipefail
          npm run test:runtime 2>&1 | tee "$RUNNER_TEMP/project-dev-runtime.tap"
      - name: 在检查摘要中标出失败用例
        if: failure()
        shell: bash
        run: |
          # 只展示测试名称、位置和断言，避免维护者为定位用例翻找整份作业日志。
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "project-dev-runtime.tap"
          if report.exists():
              remaining = 0
              details = []
              for line in report.read_text(errors="replace").splitlines():
                  if line.lstrip().startswith("not ok "):
                      title = line.strip().replace("%", "%25")
                      print(f"::error::{title}")
                      details.append(line.strip())
                      remaining = 35
                  elif remaining:
                      remaining -= 1
                      if re.match(r"\s*(location:|error:|code:|operator:|expected:|actual:|at TestContext|duration_ms:)", line, re.I):
                          detail = line.strip()[:350]
                          details.append(detail)
                          if detail.startswith(("at TestContext", "location:", "code:")):
                              print("::notice::" + detail.replace("%", "%25"))
              if details:
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                      summary.write("#### 失败的测试\n\n````text\n" + "\n".join(details) + "\n````\n")
          PY

  windows-readonly:
    name: Windows PowerShell 与跨会话读取
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.6"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:plugin
      - name: 原生 PowerShell 读取及真实打包 MCP、钩子回归
        run: node --test --test-concurrency=2 dist/tests/shell-readonly.test.js dist/tests/readonly-hooks.integration.test.js dist/tests/sample.test.js
