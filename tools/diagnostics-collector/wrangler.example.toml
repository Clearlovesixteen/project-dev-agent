name = "project-dev-diagnostics"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DIAGNOSTICS_DB"
database_name = "project-dev-diagnostics"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[[ratelimits]]
name = "PUBLIC_SOURCE_LIMIT"
namespace_id = "1310301"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "PUBLIC_TOTAL_LIMIT"
namespace_id = "1310302"
simple = { limit = 300, period = 60 }

[triggers]
crons = ["17 3 * * *"]

# 写入令牌通过 wrangler secret put WRITE_TOKEN 配置，不能提交到 GitHub。
# 私有 POST /events 与公开 POST /public/events 均只写；查看与导出使用维护者的账户权限。
